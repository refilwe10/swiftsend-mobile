name: Build and Test Mobile App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify TypeScript compiles
        run: npx tsc --noEmit 

      - name: Build successful
        run: echo " Mobile app build passed!"